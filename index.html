<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍁 Autumn Mini-Game Arcade 🍁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="arcade-container">
        <!-- MAIN MENU SCREEN -->
        <div id="main-menu">
            <h1>🍁 Autumn Arcade 🍁</h1>
            <p>Select a mini-game to play!</p>
            <br>
            <button class="btn" onclick="showModeSelect()">🍃 Leaf Catcher</button>
        </div>

        <!-- Leaf Catcher MODE SELECTION SCREEN -->
        <div id="mode-screen" class="hidden">
            <h1>🍃 Leaf Catcher</h1>
            <p>Choose your game mode:</p>
            <br>
            <button class="btn" onclick="startLeafGame(20)">⚡ Quick Mode (20s)</button>
            <button class="btn" onclick="startLeafGame(30)">🍁 Normal Mode (30s)</button>
            <button class="btn" onclick="startLeafGame(45)">🏆 Marathon Mode (45s)</button>
            <br>
            <button class="btn" onclick="returnToMenu()" style="background-color: #7f8c8d !important; box-shadow: 0 4px #515a5b !important;">Back</button>
        </div>

        <!--Memory Match MODE SELECTION-->
        <div id="memory-mode-screen" class="hidden">
            <h1>🧠 Memory Match</h1>
            <p>Choose your grid size:</p>
            <br>
            <button class="btn" onclick="startMemoryGame(4)">Easy (4 x 2)</button>
            <button class="btn" onclick="startMemoryGame(6)">Medium (4 x 3)</button>
            <br>
            <button class="btn" onclick="returnToMenu()" style="background-color: #7f8c8d !important; box-shadow: 0 4px #515a5b !important;">Back</button>
        </div>

        <!-- Leaf Catcher GAMEPLAY SCREEN -->
        <div id="game-screen" class="hidden">
            <h1>🍃 Leaf Catcher</h1>
            <div class="hud">
                <span id="score-display">Score: 0</span>
                <span id="timer-display">Time: 20s</span>
            </div>
            
            <div id="game-canvas"></div>

            <button class="btn hidden" id="play-again-btn" onclick="startLeafGame()">Play Again</button>
            <button class="btn hidden" id="mode-select-btn" onclick="showModeSelect()">Change Mode</button>
            <button class="btn hidden" id="back-btn" onclick="returnToMenu()">Back to Menu</button>
        </div>

        <!--Memory Match GAME SCREEN-->
        <div id="memory-game-screen" class="hidden">
            <h1>🧠 Memory Match</h1>
            <div class = "hud">
                <span id="memory-moves">Moves: 0</span>
                <span id="memory-matches">Matches: 0</span>
            </div>

            <div id="memory-grid" class="memory-grid-container"></div>

            <button class="btn hidden" id="memory-back-btn" onclick="returnToMenu()">Back To Menu</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
